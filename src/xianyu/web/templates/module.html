{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<header class="page-header">
  <h2>{{ title }}</h2>
  <p>统一查看该模块下的最近记录。</p>
</header>

<section>
  {% if items %}
    {% for item in items %}
    <div class="file-card">
      <h3><a href="/file?path={{ item.path }}">{{ item.name }}</a></h3>
      <pre>{{ item.content }}</pre>
    </div>
    {% endfor %}
  {% else %}
    <p>暂无记录。</p>
  {% endif %}
</section>
{% endblock %}

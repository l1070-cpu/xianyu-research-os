{% extends "base.html" %}

{% block title %}科研记忆中心{% endblock %}

{% block content %}
<header class="page-header">
  <h2>🧠 科研记忆中心</h2>
  <p>记录失败经验、优化方案和复盘结论。</p>
</header>

<section>
  <h3>＋ 新建失败经验 / 科研经验</h3>
  <form method="post" action="/memory/new">
    <p>
      <label>经验标题</label><br>
      <input name="title" placeholder="例如：HP20柱流速异常 / WB背景高 / HCT116划痕细胞漂浮" required>
    </p>
    <button type="submit">生成科研记忆</button>
  </form>
  <form method="post" action="/backup" style="margin:10px 0;">
    <button type="submit">一键备份</button>
  </form>
</section>

<section>
  <h3>最近科研记忆</h3>
  {% if items %}
    {% for item in items %}
    <div class="file-card">
      <h3><a href="/file?path={{ item.path }}">{{ item.name }}</a></h3>
      <p>{{ item.path }}</p>
      <pre>{{ item.content }}</pre>
    </div>
    {% endfor %}
  {% else %}
    <p>暂无科研记忆。</p>
  {% endif %}
</section>
{% endblock %}

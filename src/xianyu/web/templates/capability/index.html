{% extends "base.html" %}

{% block title %}能力包中心{% endblock %}

{% block content %}
<header class="page-header">
  <h2>🧩 能力包中心</h2>
  <p>集中管理每个科研模块的 workflow、checklist、prompt、SOP 和最佳实践。</p>
</header>

<section>
  {% if items %}
    {% for item in items %}
    <div class="file-card">
      <h3><a href="/file?path={{ item.path }}">{{ item.name }}</a></h3>
      <p>{{ item.path }}</p>
      <pre>{{ item.content }}</pre>
    </div>
    {% endfor %}
  {% else %}
    <p>暂无能力包。</p>
  {% endif %}
</section>
{% endblock %}

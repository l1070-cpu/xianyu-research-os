{% extends "base.html" %}

{% block title %}{{ path }}{% endblock %}

{% block content %}
<header class="page-header">
  <h2>{{ path }}</h2>
  <p>文件查看、编辑和删除入口。</p>
</header>

<section>
  <div class="record-actions">
    <a href="/edit?path={{ path }}">✏️ 编辑此记录</a>
    <form method="post" action="/delete" onsubmit="return confirm('确定删除这条记录吗？');">
      <input type="hidden" name="path" value="{{ path }}">
      <button type="submit">删除此记录</button>
    </form>
  </div>
</section>

<section>
  <pre>{{ content }}</pre>
</section>
{% endblock %}

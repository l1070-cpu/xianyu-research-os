{% extends "base.html" %}

{% block title %}PDF 库{% endblock %}

{% block content %}
<header class="page-header">
  <h2>📚 PDF 库</h2>
  <p>旧版 PDF 管理入口，建议优先使用文献中心 V2。</p>
</header>

<section>
  <div class="file-card">
    <h3>推荐入口</h3>
    <p><a href="/literature-v2">前往 文献中心 V2</a></p>
  </div>
</section>

<section>
  {% if items %}
    {% for item in items %}
    <div class="file-card">
      <h3><a href="/pdf?path={{ item.path }}" target="_blank">{{ item.name }}</a></h3>
      <p>{{ item.path }}</p>
      <div class="record-actions">
        <form method="post" action="/pdf-to-note">
          <input type="hidden" name="path" value="{{ item.path }}">
          <button type="submit">生成文献笔记</button>
        </form>
        <form method="post" action="/pdf-extract-note">
          <input type="hidden" name="path" value="{{ item.path }}">
          <button type="submit">解析 PDF 生成笔记</button>
        </form>
      </div>
    </div>
    {% endfor %}
  {% else %}
    <p>暂无 PDF。请先上传文献 PDF。</p>
  {% endif %}
</section>
{% endblock %}

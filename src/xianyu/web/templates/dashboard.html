{% extends "base.html" %}

{% block title %}咸鱼日常打工 OS Dashboard{% endblock %}

{% block content %}
<header class="page-header">
  <h2>今天要干啥？</h2>
  <p>Personal AI Research Workspace</p>
</header>

<section class="project-grid">
  <article class="file-card">
    <h3>📌 当前项目</h3>
    <p>金毛狗脊治疗缺血性脑卒中项目</p>
  </article>

  <article class="file-card">
    <h3>📈 项目进度</h3>
    <p><strong>{{ progress }}%</strong></p>
    <div class="progress-track">
      <div class="progress-fill" style="width: {{ progress }}%;"></div>
    </div>
  </article>
</section>

<section>
  <h3>📅 今日任务</h3>
  <pre>{{ today }}</pre>
</section>

<section>
  <h3>📁 项目总览</h3>
  <pre>{{ overview }}</pre>
</section>
{% endblock %}

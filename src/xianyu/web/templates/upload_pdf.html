{% extends "base.html" %}

{% block title %}上传 PDF{% endblock %}

{% block content %}
<header class="page-header">
  <h2>📄 上传文献 PDF</h2>
  <p>旧版 PDF 上传入口，建议优先使用文献中心 V2。</p>
</header>

<section>
  <div class="file-card">
    <h3>推荐入口</h3>
    <p><a href="/literature-v2">前往 文献中心 V2</a></p>
  </div>
</section>

<section>
  <form method="post" action="/upload-pdf" enctype="multipart/form-data">
    <p>
      <label>选择 PDF 文件</label><br>
      <input type="file" name="file" accept=".pdf" required>
    </p>
    <button type="submit">上传 PDF</button>
  </form>
</section>

<section>
  <p>上传后文件会保存到：</p>
  <pre>04_文献笔记/PDF库/</pre>
</section>
{% endblock %}

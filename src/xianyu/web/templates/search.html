{% extends "base.html" %}

{% block title %}搜索{% endblock %}

{% block content %}
<header class="page-header">
  <h2>🔍 全局搜索</h2>
  <p>搜索 HP20、CCK-8、AKT1、Discussion 等关键词。</p>
</header>

<section>
  <form method="get" action="/search">
    <input name="q" value="{{ q }}" placeholder="搜索 HP20 / CCK8 / AKT1 / Discussion">
    <button type="submit">搜索</button>
  </form>
</section>

<section>
  {% if results %}
    {% for item in results %}
    <div class="file-card">
      <h3><a href="/file?path={{ item.path }}">{{ item.name }}</a></h3>
      <p>{{ item.path }}</p>
      <pre>{{ item.content }}</pre>
    </div>
    {% endfor %}
  {% else %}
    <p>暂无结果。</p>
  {% endif %}
</section>
{% endblock %}
